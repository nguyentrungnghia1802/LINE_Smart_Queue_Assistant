upstream validation_api {
    least_conn;
    server api-1:4000;
    server api-2:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location /validation/api-1/ {
        rewrite ^/validation/api-1/(.*)$ /$1 break;
        proxy_pass http://api-1:4000;
        include /etc/nginx/validation-proxy-headers.conf;
        add_header X-SQA-Upstream api-1 always;
    }

    location /validation/api-2/ {
        rewrite ^/validation/api-2/(.*)$ /$1 break;
        proxy_pass http://api-2:4000;
        include /etc/nginx/validation-proxy-headers.conf;
        add_header X-SQA-Upstream api-2 always;
    }

    location ^~ /api/v1/realtime/ {
        proxy_pass http://validation_api;
        include /etc/nginx/validation-proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 45s;
        add_header X-Accel-Buffering no;
        add_header X-SQA-Upstream $upstream_addr always;
    }

    location / {
        proxy_pass http://validation_api;
        include /etc/nginx/validation-proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header X-SQA-Upstream $upstream_addr always;
    }
}
