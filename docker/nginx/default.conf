server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS can return a new api container IP after recreate. Resolve the
    # service name through Docker DNS at request time instead of pinning the startup IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header Referrer-Policy           "no-referrer-when-downgrade"    always;
    add_header X-XSS-Protection          "1; mode=block"                 always;

    # ── Realtime SSE — keep the full path and disable buffering/compression ──
    location ^~ /api/v1/realtime/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 6m;
        proxy_send_timeout 6m;
    }

    # ── API reverse proxy — keep /api prefix for backend /api/v1 routes ───────
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Persisted local media served by the API ───────────────────────────────
    location /media/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback — all routes served by index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static assets — Vite output is content-hashed → safe long-term cache ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health probe (used by Docker HEALTHCHECK and load-balancers) ───────────
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── Block hidden files (.env, .git, .htaccess …) ──────────────────────────
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }
}
