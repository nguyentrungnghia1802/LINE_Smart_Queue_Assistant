name: CD (manual production release)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable Docker tag; leave empty to use git-<commit SHA>'
        required: false
        default: ''
        type: string
      confirm:
        description: 'Type DEPLOY to build, publish, and deploy the selected ref'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-input:
    name: Validate release confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "DEPLOY" ]]; then
            echo "The confirm input must be exactly DEPLOY." >&2
            exit 1
          fi

  build-publish:
    name: Build and publish immutable images
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      api_image: ${{ steps.metadata.outputs.api_image }}
      web_image: ${{ steps.metadata.outputs.web_image }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
    steps:
      - name: 📥 Checkout selected ref
        uses: actions/checkout@v4

      - name: 🏷️ Resolve immutable image tag
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$VITE_LIFF_ID" ]]; then
            echo "DOCKERHUB_USERNAME and VITE_LIFF_ID repository variables are required." >&2
            exit 1
          fi
          tag="${REQUESTED_TAG:-git-${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ || "$tag" == "latest" ]]; then
            echo "image_tag must contain only letters, numbers, '.', '_' or '-' and cannot be latest" >&2
            exit 1
          fi
          api_image="docker.io/${DOCKERHUB_USERNAME}/line-smart-queue-api:${tag}"
          web_image="docker.io/${DOCKERHUB_USERNAME}/line-smart-queue-web:${tag}"
          {
            echo "image_tag=$tag"
            echo "api_image=$api_image"
            echo "web_image=$web_image"
          } >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.metadata.outputs.api_image }}

      - name: 🌐 Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          target: runner
          push: true
          build-args: |
            VITE_API_URL=
            VITE_LIFF_ID=${{ vars.VITE_LIFF_ID }}
            VITE_LIFF_MOCK=false
            VITE_PAYMENT_MODE=demo
          tags: ${{ steps.metadata.outputs.web_image }}

  deploy:
    name: Deploy to production server
    needs: build-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      API_IMAGE: ${{ needs.build-publish.outputs.api_image }}
      WEB_IMAGE: ${{ needs.build-publish.outputs.web_image }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: 🔐 Configure pinned SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/production_deploy_key"
          chmod 600 "$RUNNER_TEMP/production_deploy_key"

      - name: 🚀 Pull, migrate, and start immutable release
        run: |
          remote_env=$(printf 'DEPLOY_PATH=%q API_IMAGE=%q WEB_IMAGE=%q' "$DEPLOY_PATH" "$API_IMAGE" "$WEB_IMAGE")
          ssh -i "$RUNNER_TEMP/production_deploy_key" \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f deploy/.env
          export LINE_QUEUE_API_IMAGE="$API_IMAGE"
          export LINE_QUEUE_WEB_IMAGE="$WEB_IMAGE"
          compose=(docker compose --env-file deploy/.env -f deploy/docker-compose.yml)
          "${compose[@]}" config -q
          "${compose[@]}" pull api worker web
          "${compose[@]}" up -d postgres redis
          "${compose[@]}" run --rm api npm run db:migrate
          "${compose[@]}" up -d --remove-orphans --wait api worker web
          api_container=$("${compose[@]}" ps -q api)
          media_mount_type=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/var/media"}}{{.Type}}{{end}}{{end}}' "$api_container")
          test "$media_mount_type" = volume
          "${compose[@]}" exec -T api sh -eu -c '
            if [ "${MEDIA_STORAGE_PROVIDER:-}" = local ]; then
              test "$MEDIA_LOCAL_DIR" = /app/var/media
              test -w /app/var/media
            fi
          '
          "${compose[@]}" exec -T web wget -qO- http://127.0.0.1/health >/dev/null
          "${compose[@]}" ps
          REMOTE
