name: CD (validated main production release)

on:
  workflow_run:
    workflows: ['CI Quality Gates']
    types: [completed]
    branches: [main]

run-name: Production release ${{ github.event.workflow_run.head_sha }}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    name: Approve, publish, and deploy immutable release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://smartqueue.io.vn/
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GHCR_OWNER: ${{ github.repository_owner }}
      LINE_LOGIN_LIFF_ID: ${{ vars.LINE_LOGIN_LIFF_ID }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: 📥 Checkout validated main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: 🏷️ Resolve immutable image tag
        id: metadata
        run: |
          require_value() {
            if [[ -z "$2" ]]; then
              echo "$1 is required in the protected production environment." >&2
              exit 1
            fi
          }
          require_value GHCR_OWNER "$GHCR_OWNER"
          require_value LINE_LOGIN_LIFF_ID "$LINE_LOGIN_LIFF_ID"
          require_value PRODUCTION_DEPLOY_PATH "$DEPLOY_PATH"
          require_value PRODUCTION_SSH_HOST "$SSH_HOST"
          require_value PRODUCTION_SSH_PORT "$SSH_PORT"
          require_value PRODUCTION_SSH_USER "$SSH_USER"
          require_value PRODUCTION_SSH_PRIVATE_KEY "$SSH_PRIVATE_KEY"
          require_value PRODUCTION_SSH_KNOWN_HOSTS "$SSH_KNOWN_HOSTS"
          owner="${GHCR_OWNER,,}"
          if [[ ! "$owner" =~ ^[a-z0-9][a-z0-9-]{0,38}$ ]]; then
            echo "The GitHub repository owner contains unsupported characters." >&2
            exit 1
          fi
          if [[ ! "$LINE_LOGIN_LIFF_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "LINE_LOGIN_LIFF_ID contains unsupported characters." >&2
            exit 1
          fi
          tag="git-${RELEASE_SHA}"
          if [[ ! "$tag" =~ ^git-[0-9a-f]{40}$ ]]; then
            echo "The selected ref did not resolve to a full lowercase Git SHA." >&2
            exit 1
          fi
          api_image="ghcr.io/${owner}/line-smart-queue-api:${tag}"
          web_image="ghcr.io/${owner}/line-smart-queue-web:${tag}"
          {
            echo "image_tag=$tag"
            echo "api_image=$api_image"
            echo "web_image=$web_image"
            echo "api_latest=ghcr.io/${owner}/line-smart-queue-api:latest"
            echo "web_latest=ghcr.io/${owner}/line-smart-queue-web:latest"
          } >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ steps.metadata.outputs.api_image }}
            ${{ steps.metadata.outputs.api_latest }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.image_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 🌐 Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          target: runner
          push: true
          build-args: |
            VITE_API_URL=
            LINE_LOGIN_LIFF_ID=${{ vars.LINE_LOGIN_LIFF_ID }}
            VITE_LIFF_MOCK=false
            VITE_PAYMENT_MODE=demo
            VITE_SENTRY_RELEASE=${{ env.RELEASE_SHA }}
          tags: |
            ${{ steps.metadata.outputs.web_image }}
            ${{ steps.metadata.outputs.web_latest }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.image_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 🔐 Configure pinned SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/production_deploy_key"
          chmod 600 "$RUNNER_TEMP/production_deploy_key"

      - name: 📤 Sync versioned Compose and recovery tooling
        env:
          TOOLING_ARCHIVE: /tmp/line-smart-queue-deploy-${{ github.run_id }}.tar.gz
        run: |
          tar -czf "$RUNNER_TEMP/deploy-tooling.tar.gz" deploy/docker-compose.yml deploy/backup deploy/scripts
          tar -tzf "$RUNNER_TEMP/deploy-tooling.tar.gz" >/dev/null
          scp -i "$RUNNER_TEMP/production_deploy_key" \
            -P "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/deploy-tooling.tar.gz" \
            "$SSH_USER@$SSH_HOST:$TOOLING_ARCHIVE"
          remote_env=$(printf 'DEPLOY_PATH=%q TOOLING_ARCHIVE=%q' "$DEPLOY_PATH" "$TOOLING_ARCHIVE")
          ssh -i "$RUNNER_TEMP/production_deploy_key" \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
          "$SSH_USER@$SSH_HOST" "$remote_env bash -se" <<'REMOTE'
          set -euo pipefail
          resolve_project_root() {
            local configured=${1%/}
            if [[ -f "$configured/deploy/.env" ]]; then
              (cd -- "$configured" && pwd -P)
              return
            fi
            if [[ "$configured" == */deploy && -f "$configured/.env" ]]; then
              (cd -- "${configured%/deploy}" && pwd -P)
              return
            fi
            printf '[release-deploy] ERROR: PRODUCTION_DEPLOY_PATH must be the project root containing deploy/.env or that deploy directory: %s\n' "$configured" >&2
            return 1
          }
          trap 'rm -f -- "$TOOLING_ARCHIVE"' EXIT
          project_root=$(resolve_project_root "$DEPLOY_PATH")
          cd -- "$project_root"
          tar -xzf "$TOOLING_ARCHIVE"
          chmod 700 deploy/backup/*.sh deploy/backup/tests/*.sh deploy/scripts/*.sh deploy/scripts/tests/*.sh
          REMOTE

      - name: 🚀 Backup-gated immutable release
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          remote_env=$(printf 'DEPLOY_PATH=%q IMAGE_TAG=%q TOOLING_REVISION=%q' "$DEPLOY_PATH" "$IMAGE_TAG" "$RELEASE_SHA")
          ssh -i "$RUNNER_TEMP/production_deploy_key" \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
          "$SSH_USER@$SSH_HOST" "$remote_env bash -se" <<'REMOTE'
          set -euo pipefail
          resolve_project_root() {
            local configured=${1%/}
            if [[ -f "$configured/deploy/.env" ]]; then
              (cd -- "$configured" && pwd -P)
              return
            fi
            if [[ "$configured" == */deploy && -f "$configured/.env" ]]; then
              (cd -- "${configured%/deploy}" && pwd -P)
              return
            fi
            printf '[release-deploy] ERROR: PRODUCTION_DEPLOY_PATH must be the project root containing deploy/.env or that deploy directory: %s\n' "$configured" >&2
            return 1
          }
          project_root=$(resolve_project_root "$DEPLOY_PATH")
          cd -- "$project_root"
          export BACKUP_TOOLING_REVISION="$TOOLING_REVISION"
          export DEPLOY_APPROVED=GITHUB_ENVIRONMENT_APPROVED
          backup_id=$(deploy/backup/deploy-safe.sh "$IMAGE_TAG")
          deploy/backup/verify-backup.sh "$backup_id" >/dev/null
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml ps
          printf 'Verified pre-deployment backup: %s\n' "$backup_id"
          REMOTE

      - name: 🔗 Show production URL
        if: ${{ success() }}
        run: |
          {
            echo '## Production deployment'
            echo ''
            echo 'The immutable release completed successfully.'
            echo ''
            echo '[Open production](https://smartqueue.io.vn/)'
          } >> "$GITHUB_STEP_SUMMARY"
