name: CD (manual production release)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable Docker tag; leave empty to use git-<commit SHA>'
        required: false
        default: ''
        type: string
      confirm:
        description: 'Type DEPLOY to build, publish, and deploy the selected ref'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-input:
    name: Validate release confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "DEPLOY" ]]; then
            echo "The confirm input must be exactly DEPLOY." >&2
            exit 1
          fi

  build-publish:
    name: Build and publish immutable images
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      api_image: ${{ steps.metadata.outputs.api_image }}
      web_image: ${{ steps.metadata.outputs.web_image }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
    steps:
      - name: 📥 Checkout selected ref
        uses: actions/checkout@v4

      - name: 🏷️ Resolve immutable image tag
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$VITE_LIFF_ID" ]]; then
            echo "DOCKERHUB_USERNAME and VITE_LIFF_ID repository variables are required." >&2
            exit 1
          fi
          tag="${REQUESTED_TAG:-git-${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ || "$tag" == "latest" ]]; then
            echo "image_tag must contain only letters, numbers, '.', '_' or '-' and cannot be latest" >&2
            exit 1
          fi
          api_image="docker.io/${DOCKERHUB_USERNAME}/line-smart-queue-api:${tag}"
          web_image="docker.io/${DOCKERHUB_USERNAME}/line-smart-queue-web:${tag}"
          {
            echo "image_tag=$tag"
            echo "api_image=$api_image"
            echo "web_image=$web_image"
          } >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.metadata.outputs.api_image }}

      - name: 🌐 Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          target: runner
          push: true
          build-args: |
            VITE_API_URL=
            VITE_LIFF_ID=${{ vars.VITE_LIFF_ID }}
            VITE_LIFF_MOCK=false
            VITE_PAYMENT_MODE=demo
          tags: ${{ steps.metadata.outputs.web_image }}

  deploy:
    name: Deploy to production server
    needs: build-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      API_IMAGE: ${{ needs.build-publish.outputs.api_image }}
      WEB_IMAGE: ${{ needs.build-publish.outputs.web_image }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: 📥 Checkout selected release tooling
        uses: actions/checkout@v4

      - name: 🔐 Configure pinned SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/production_deploy_key"
          chmod 600 "$RUNNER_TEMP/production_deploy_key"

      - name: 📤 Sync versioned Compose and recovery tooling
        env:
          TOOLING_ARCHIVE: /tmp/line-smart-queue-deploy-${{ github.run_id }}.tar.gz
        run: |
          tar -czf "$RUNNER_TEMP/deploy-tooling.tar.gz" deploy/docker-compose.yml deploy/backup
          scp -i "$RUNNER_TEMP/production_deploy_key" \
            -P "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/deploy-tooling.tar.gz" \
            "$SSH_USER@$SSH_HOST:$TOOLING_ARCHIVE"
          remote_env=$(printf 'DEPLOY_PATH=%q TOOLING_ARCHIVE=%q' "$DEPLOY_PATH" "$TOOLING_ARCHIVE")
          ssh -i "$RUNNER_TEMP/production_deploy_key" \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -se" <<'REMOTE'
          set -euo pipefail
          test -d "$DEPLOY_PATH"
          test -f "$DEPLOY_PATH/deploy/.env"
          cd "$DEPLOY_PATH"
          tar -xzf "$TOOLING_ARCHIVE"
          rm -f -- "$TOOLING_ARCHIVE"
          chmod 700 deploy/backup/*.sh deploy/backup/tests/*.sh
          REMOTE

      - name: 🚀 Backup-gated immutable release
        run: |
          remote_env=$(printf 'DEPLOY_PATH=%q API_IMAGE=%q WEB_IMAGE=%q TOOLING_REVISION=%q' "$DEPLOY_PATH" "$API_IMAGE" "$WEB_IMAGE" "$GITHUB_SHA")
          ssh -i "$RUNNER_TEMP/production_deploy_key" \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "$remote_env bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f deploy/.env
          export LINE_QUEUE_API_IMAGE="$API_IMAGE"
          export LINE_QUEUE_WEB_IMAGE="$WEB_IMAGE"
          export BACKUP_TOOLING_REVISION="$TOOLING_REVISION"
          export DEPLOY_APPROVED=GITHUB_ENVIRONMENT_APPROVED
          backup_id=$(deploy/backup/deploy-safe.sh)
          deploy/backup/verify-backup.sh "$backup_id" >/dev/null
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml ps
          printf 'Verified pre-deployment backup: %s\n' "$backup_id"
          REMOTE
