name: CI Quality Gates

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, chore/dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: 🔐 Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🔎 Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: 🛡️ Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🛡️ Audit production dependencies
        run: npm run audit:ci

  formatting:
    name: ✨ Formatting
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: ✨ Check formatting
        run: npm run format:check

  spelling:
    name: 🔤 Spelling
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔤 Check spelling
        run: npm run spell:check

  compose-validation:
    name: 🐳 Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐳 Validate development Compose
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose --env-file .env.example -f docker-compose.dev.yml config -q
      - name: 🐳 Validate isolated validation Compose
        run: docker compose -f docker-compose.validation.yml config -q
      - name: 🐳 Validate production Compose template
        run: |
          cp deploy/.env.example deploy/.env
          trap 'rm -f deploy/.env' EXIT
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config -q

  media-persistence:
    name: 💾 Local media persistence
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 🐳 Build production API runner
        run: docker build --target runner -t line-smart-queue-api:media-persistence-validation -f docker/api/Dockerfile .
      - name: 💾 Verify named-volume persistence across container recreation
        run: npm run media:persistence:verify

  backup-recovery:
    name: 🛟 Backup and restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🛟 Rehearse isolated database/media recovery and deploy gate
        run: bash deploy/backup/tests/rehearsal.sh

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🧹 Run lint
        run: npm run lint

  typecheck:
    name: 🔷 Type-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔷 Run type-check
        run: npm run typecheck

  openapi:
    name: 📘 OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 📘 Check OpenAPI contract
        run: npm run openapi:check

  api-tests:
    name: 🧪 API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: line_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d line_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/line_queue_test
      JWT_SECRET: ci-only-jwt-secret-never-use-in-production
      DEMO_PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret
      LINE_MESSAGING_CHANNEL_ACCESS_TOKEN: ''
      LINE_MESSAGING_CHANNEL_SECRET: ci-only-line-secret
      LINE_ID_TOKEN_VERIFICATION_MODE: mock
      MEDIA_STORAGE_MODE: mock
      CORS_ORIGIN: http://127.0.0.1:5174
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🧪 Run API tests and coverage thresholds
        run: npm run test:coverage -w apps/api -- --runInBand

  web-tests:
    name: 🌐 Web and shared tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🌐 Run web tests
        run: npm run test -w apps/web
      - name: 🔗 Run shared-package tests
        run: npm run test -w packages/shared --if-present

  migration-smoke:
    name: 🗄️ Migration and seed smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: line_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d line_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/line_queue_test
      JWT_SECRET: ci-only-jwt-secret-never-use-in-production
      DEMO_PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret
      LINE_MESSAGING_CHANNEL_ACCESS_TOKEN: ''
      LINE_MESSAGING_CHANNEL_SECRET: ci-only-line-secret
      LINE_ID_TOKEN_VERIFICATION_MODE: mock
      MEDIA_STORAGE_MODE: mock
      CORS_ORIGIN: http://127.0.0.1:5174
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🗄️ Apply canonical migrations
        run: npm run db:migrate
      - name: ✅ Check migration status
        run: npm run db:migrate:status
      - name: 🌱 Run idempotent administrator seed smoke
        run: |
          npm run db:seed
          npm run db:seed

  build:
    name: 🏗️ Production build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🏗️ Build shared, API, and Web
        run: npm run build

  browser-e2e:
    name: 🎭 Browser E2E
    needs:
      - formatting
      - spelling
      - compose-validation
      - media-persistence
      - backup-recovery
      - lint
      - typecheck
      - openapi
      - api-tests
      - web-tests
      - migration-smoke
      - build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: line_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d line_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/line_queue_test
      JWT_SECRET: ci-only-jwt-secret-never-use-in-production
      DEMO_PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret
      LINE_MESSAGING_CHANNEL_ACCESS_TOKEN: ''
      LINE_MESSAGING_CHANNEL_SECRET: ci-only-line-secret
      LINE_ID_TOKEN_VERIFICATION_MODE: mock
      MEDIA_STORAGE_MODE: mock
      CORS_ORIGIN: http://127.0.0.1:5174
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🗄️ Prepare isolated E2E database
        run: npm run db:migrate
      - name: 🌱 Load browser-only fixtures
        run: npm run db:fixture:e2e
      - name: 🎭 Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: 🎭 Run desktop and mobile browser E2E
        run: npm run e2e:all
